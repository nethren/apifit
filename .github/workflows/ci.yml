name: Check APIFit
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run repo:check
      - run: npm run check
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag apifit:ci .
      - name: Start isolated public-mode smoke (AI disabled)
        run: >-
          docker run -d --name apifit-smoke --network none --read-only
          --tmpfs /tmp:size=32m --cap-drop ALL --security-opt no-new-privileges
          --mount type=volume,source=apifit-smoke-data,target=/data
          -e APIFIT_ACCESS_MODE=public
          -e APIFIT_PUBLIC_ORIGIN=https://apifit.example.com
          -e APIFIT_AI_ENABLED=false apifit:ci
      - name: Check listener and writable persistent volume
        run: |
          for attempt in 1 2 3 4 5; do
            if docker exec apifit-smoke node scripts/container-health.mjs; then break; fi
            sleep 1
          done
          docker exec apifit-smoke node scripts/container-health.mjs
          docker exec apifit-smoke node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            import http from "node:http";
            import assert from "node:assert/strict";
            const read = path => new Promise((resolve,reject) => {
              const request = http.get({hostname:"127.0.0.1",port:8080,path,headers:{Host:"apifit.example.com"},timeout:3000}, response => {
                let text=""; response.setEncoding("utf8"); response.on("data",chunk=>text+=chunk);
                response.on("end",()=>resolve({status:response.statusCode,text}));
              });
              request.on("error",reject); request.on("timeout",()=>request.destroy(new Error("Smoke timeout")));
            });
            const response = await read("/");
            assert.equal(response.status,200,"Public root should serve the built interface");
            assert.ok(response.text.includes("APIFit"),"Built page should be present");
            const status = await read("/api/ai/status");
            assert.equal(status.status,200,"AI status should be readable in public mode");
            assert.equal(JSON.parse(status.text).ready,false,"AI must remain disabled in this smoke");
            writeFileSync("/data/.smoke-marker", "fictional-ci-marker");
          '
          docker restart apifit-smoke
          docker exec apifit-smoke node -e 'if(require("node:fs").readFileSync("/data/.smoke-marker","utf8")!=="fictional-ci-marker")process.exit(1)'
      - name: Remove isolated smoke container and test volume
        if: always()
        run: |
          docker rm -f apifit-smoke || true
          docker volume rm apifit-smoke-data || true
